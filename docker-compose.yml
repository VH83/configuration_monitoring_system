services:
  app:
    build: .
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: syncworks
      DB_USERNAME: syncworks
      DB_PASSWORD: syncworks
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      WATCH_ROOT: /watched
      WEBHOOK_URL: http://app:8000/api/demo/webhook
    volumes: ["./watched:/watched"]
    depends_on: [mysql, redis]
  worker:
    build: .
    command: php artisan queue:work redis --tries=5 --timeout=30
    env_file: .env
    environment: { DB_CONNECTION: mysql, DB_HOST: mysql, DB_DATABASE: syncworks, DB_USERNAME: syncworks, DB_PASSWORD: syncworks, QUEUE_CONNECTION: redis, REDIS_HOST: redis, WEBHOOK_URL: http://app:8000/api/demo/webhook }
    depends_on: [app, redis]
  watcher:
    build: .
    command: php artisan config:watch
    env_file: .env
    environment: { DB_CONNECTION: mysql, DB_HOST: mysql, DB_DATABASE: syncworks, DB_USERNAME: syncworks, DB_PASSWORD: syncworks, QUEUE_CONNECTION: redis, REDIS_HOST: redis, WATCH_ROOT: /watched, WEBHOOK_URL: http://app:8000/api/demo/webhook }
    volumes: ["./watched:/watched"]
    depends_on: [app]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: syncworks, MYSQL_USER: syncworks, MYSQL_PASSWORD: syncworks, MYSQL_ROOT_PASSWORD: root }
    volumes: ["mysql-data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
volumes:
  mysql-data:
  redis-data: